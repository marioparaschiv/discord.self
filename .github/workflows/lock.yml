name: Lock Ancient Issues
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
concurrency:
  group: lock
jobs:
  action:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: 365
          issue-lock-reason: resolved
          process-only: issues
